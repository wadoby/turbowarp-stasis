name: Build Standalone HTML

on:
  push:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies and build
        env:
          ROUTING_STYLE: "none"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm ci
          npm run build

      - name: Package cleanly with safe JSON data blocks
        run: |
          cat << 'EOF' > bundle.js
          const fs = require('fs');
          const path = require('path');

          let html = fs.readFileSync('build/index.html', 'utf8');

          // HTMLのscriptタグ内で安全に扱えるエスケープ関数
          const safeForHtmlScript = (str) => {
            return str
              .replace(/<\/(script)/gi, '<\\/$1')
              .replace(/<!--/g, '<\\!--')
              .replace(/\u2028/g, '\\u2028')
              .replace(/\u2029/g, '\\u2029');
          };

          // 1. static/assets内の全ファイルをBase64データURIマップとして収集
          const assetDir = 'build/static/assets';
          const assetMap = {};
          if (fs.existsSync(assetDir)) {
            for (const file of fs.readdirSync(assetDir)) {
              const ext = path.extname(file).toLowerCase();
              const mime = ext === '.svg' ? 'image/svg+xml'
                         : ext === '.png' ? 'image/png'
                         : ext === '.jpg' || ext === '.jpeg' ? 'image/jpeg'
                         : ext === '.woff2' ? 'font/woff2'
                         : ext === '.woff' ? 'font/woff'
                         : ext === '.ttf' ? 'font/ttf'
                         : ext === '.mp3' ? 'audio/mpeg'
                         : ext === '.wav' ? 'audio/wav'
                         : 'application/octet-stream';
              const b64 = fs.readFileSync(path.join(assetDir, file)).toString('base64');
              assetMap['static/assets/' + file] = `data:${mime};base64,${b64}`;
            }
          }

          // 2. index.html に元々書かれている <script src="..."> のみをインライン化（二重起動防止）
          const inlinedSrcs = new Set();
          html = html.replace(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*><\/script>/gi, (match, src) => {
            const cleanSrc = src.replace(/^\.?\//, '').split('?')[0];
            const filePath = path.join('build', cleanSrc);
            if (fs.existsSync(filePath)) {
              inlinedSrcs.add(cleanSrc);
              const rawJs = fs.readFileSync(filePath, 'utf8');
              return `<script>${safeForHtmlScript(rawJs)}</script>`;
            }
            return match;
          });

          // 3. js/addons.js, js/sb.js などの分割チャンクをすべて収集
          const chunks = {};
          const walkJs = (dir) => {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walkJs(full);
              } else if (entry.name.endsWith('.js')) {
                const rel = path.relative('build', full).replace(/\\/g, '/');
                if (!inlinedSrcs.has(rel)) {
                  chunks[rel] = fs.readFileSync(full, 'utf8');
                }
              }
            }
          };
          walkJs('build');

          // 4. データは純粋な application/json タグに格納し、フックコード自体は軽量・確実に実行させる
          const dataTags = `
          <script id="__tw_chunks__" type="application/json">${safeForHtmlScript(JSON.stringify(chunks))}</script>
          <script id="__tw_assets__" type="application/json">${safeForHtmlScript(JSON.stringify(assetMap))}</script>
          <script>
          (function() {
            const CHUNKS = JSON.parse(document.getElementById('__tw_chunks__').textContent);
            const ASSETS = JSON.parse(document.getElementById('__tw_assets__').textContent);
            const blobCache = {};

            const resolveChunk = (url) => {
              if (!url || typeof url !== 'string') return null;
              for (const [key, code] of Object.entries(CHUNKS)) {
                if (url.endsWith(key) || url.includes('/' + key)) {
                  if (!blobCache[key]) {
                    blobCache[key] = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
                  }
                  return blobCache[key];
                }
              }
              return null;
            };

            const resolveAsset = (url) => {
              if (!url || typeof url !== 'string' || url.startsWith('data:')) return null;
              for (const [key, dataUri] of Object.entries(ASSETS)) {
                if (url.endsWith(key) || url.includes('/' + key)) {
                  return dataUri;
                }
              }
              return null;
            };

            const origScriptSrc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
            Object.defineProperty(HTMLScriptElement.prototype, 'src', {
              get() { return origScriptSrc.get.call(this); },
              set(val) {
                const blobUrl = resolveChunk(val);
                return origScriptSrc.set.call(this, blobUrl || val);
              }
            });

            const origImgSrc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
            Object.defineProperty(HTMLImageElement.prototype, 'src', {
              get() { return origImgSrc.get.call(this); },
              set(val) {
                const dataUri = resolveAsset(val);
                return origImgSrc.set.call(this, dataUri || val);
              }
            });

            const origSetAttr = Element.prototype.setAttribute;
            Element.prototype.setAttribute = function(name, val) {
              if (String(name).toLowerCase() === 'src') {
                if (this.tagName === 'SCRIPT') {
                  const blobUrl = resolveChunk(val);
                  if (blobUrl) return origSetAttr.call(this, name, blobUrl);
                } else if (this.tagName === 'IMG') {
                  const dataUri = resolveAsset(val);
                  if (dataUri) return origSetAttr.call(this, name, dataUri);
                }
              }
              return origSetAttr.call(this, name, val);
            };

            const origFetch = window.fetch;
            window.fetch = function(input, init) {
              const url = typeof input === 'string' ? input : (input && input.url) || '';
              const dataUri = resolveAsset(url);
              if (dataUri) {
                return origFetch.call(this, dataUri, init);
              }
              return origFetch.call(this, input, init);
            };
          })();
          </script>`;

          html = html.replace('<head>', '<head>\n' + dataTags);
          html = html.replace(/<link\s+rel="manifest"[^>]*>/gi, '');
          fs.writeFileSync('build/standalone.html', html);
          console.log('Success! Inlined:', [...inlinedSrcs], 'Chunks:', Object.keys(chunks).length, 'Assets:', Object.keys(assetMap).length);
          EOF
          node bundle.js

      - name: Upload Standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: turbowarp-standalone
          path: build/standalone.html
