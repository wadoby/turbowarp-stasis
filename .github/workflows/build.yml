name: Build Standalone HTML

on:
  push:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies and build
        env:
          ROUTING_STYLE: "none"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm ci
          npm run build

      - name: Bundle all chunks, assets, and fetch hooks into standalone.html
        run: |
          cat << 'EOF' > bundle.js
          const fs = require('fs');
          const path = require('path');

          let html = fs.readFileSync('build/index.html', 'utf8');

          // 1. static/assets内の全ファイルをBase64データURIマップとして収集
          const assetDir = 'build/static/assets';
          const assetMap = {};
          if (fs.existsSync(assetDir)) {
            for (const file of fs.readdirSync(assetDir)) {
              const ext = path.extname(file).toLowerCase();
              const mime = ext === '.svg' ? 'image/svg+xml'
                         : ext === '.png' ? 'image/png'
                         : ext === '.jpg' || ext === '.jpeg' ? 'image/jpeg'
                         : ext === '.woff2' ? 'font/woff2'
                         : ext === '.woff' ? 'font/woff'
                         : ext === '.ttf' ? 'font/ttf'
                         : ext === '.mp3' ? 'audio/mpeg'
                         : ext === '.wav' ? 'audio/wav'
                         : 'application/octet-stream';
              const b64 = fs.readFileSync(path.join(assetDir, file)).toString('base64');
              assetMap['static/assets/' + file] = `data:${mime};base64,${b64}`;
            }
          }

          // JS内のアセットパス文字列をBase64データURIへ安全に置換
          const replaceAssets = (code) => {
            let out = code;
            for (const [relPath, dataUri] of Object.entries(assetMap)) {
              out = out.split(relPath).join(dataUri);
            }
            return out;
          };

          // 2. HTMLに直書きされている <script src="..."> をインライン化
          const inlinedSrcs = new Set();
          html = html.replace(/<script\s+src="([^"]+)"><\/script>/g, (match, src) => {
            const cleanSrc = src.replace(/^\.?\//, '');
            const filePath = path.join('build', cleanSrc);
            if (fs.existsSync(filePath)) {
              inlinedSrcs.add(cleanSrc);
              let js = replaceAssets(fs.readFileSync(filePath, 'utf8'));
              js = js.split('</script>').join('<\\/script>');
              return '<script>' + js + '</script>';
            }
            return match;
          });

          // 3. js/addons.js や js/sb.js などの全分割JSチャンクを収集
          const chunks = {};
          const walkJs = (dir) => {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walkJs(full);
              } else if (entry.name.endsWith('.js')) {
                const rel = path.relative('build', full).replace(/\\/g, '/');
                if (!inlinedSrcs.has(rel)) {
                  chunks[rel] = replaceAssets(fs.readFileSync(full, 'utf8'));
                }
              }
            }
          };
          walkJs('build');

          const safeChunks = JSON.stringify(chunks).split('</script>').join('<\\/script>');
          const safeAssets = JSON.stringify(assetMap).split('</script>').join('<\\/script>');

          // 4. scriptタグ生成とfetch()の両方をブラウザ上でインターセプトしてメモリから返す
          const runtimeHook = `<script>
          window.__INLINE_CHUNKS__ = ${safeChunks};
          window.__INLINE_ASSETS__ = ${safeAssets};
          (function() {
            // 動的script読み込み（js/addons.jsなど）をすべてBlob URLに差し替え
            const origCreate = Document.prototype.createElement;
            Document.prototype.createElement = function(tagName, options) {
              const el = origCreate.call(this, tagName, options);
              if (String(tagName).toLowerCase() === 'script') {
                const desc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
                Object.defineProperty(el, 'src', {
                  get() { return desc.get.call(this); },
                  set(val) {
                    if (typeof val === 'string') {
                      for (const [key, code] of Object.entries(window.__INLINE_CHUNKS__)) {
                        if (val.endsWith(key) || val.includes('/' + key)) {
                          const blob = new Blob([code], { type: 'application/javascript' });
                          return desc.set.call(this, URL.createObjectURL(blob));
                        }
                      }
                    }
                    return desc.set.call(this, val);
                  }
                });
              }
              return el;
            };

            // file://でのCORSブロックを防ぐため、内蔵アセットへのfetch()を横取りして直接返す
            const origFetch = window.fetch;
            window.fetch = function(input, init) {
              const url = typeof input === 'string' ? input : (input && input.url) || '';
              if (url.startsWith('data:')) {
                return origFetch.call(this, url, init);
              }
              for (const [key, dataUri] of Object.entries(window.__INLINE_ASSETS__)) {
                if (url.endsWith(key) || url.includes('/' + key)) {
                  return origFetch.call(this, dataUri, init);
                }
              }
              return origFetch.call(this, input, init);
            };
          })();
          </script>`;

          html = html.replace('<head>', '<head>\n' + runtimeHook);
          html = html.replace(/<link\s+rel="manifest"[^>]*>/gi, '');
          fs.writeFileSync('build/standalone.html', html);
          EOF
          node bundle.js

      - name: Upload Standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: turbowarp-standalone
          path: build/standalone.html
